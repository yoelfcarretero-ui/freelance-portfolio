# Local n8n for the lead-automation demo.
# Usage:
#   cp .env.example .env        (optional, edit values)
#   docker compose up -d
#   open http://localhost:5678
services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.47.7}
    container_name: n8n-lead-demo
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    env_file:
      - path: .env
        required: false
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Madrid}
      - TZ=${GENERIC_TIMEZONE:-Europe/Madrid}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      # Plain http on localhost: allow the session cookie without TLS.
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Keep execution history small on a laptop.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflow exports, mounted read-only so they can be imported with the n8n CLI.
      - ./workflows:/workflows:ro

volumes:
  n8n_data:
