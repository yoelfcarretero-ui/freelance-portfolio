# Minimal Supabase CLI config for local development (npx supabase start).
# Everything not listed here uses the CLI defaults.
project_id = "slotbook"

[api]
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:4173"]

[auth.email]
# Local only: log in right after sign-up. Leave confirmations ON in production.
enable_confirmations = false
